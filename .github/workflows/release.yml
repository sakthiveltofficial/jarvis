name: Release Windows installer

# Push a tag like v0.3.0 to build the Windows .exe installer and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create for this release, e.g. v0.4.0 (empty = a test build tagged with the run number)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Freeze the Python backend (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python build_backend.py

      - name: Smoke-test the frozen backend
        working-directory: backend
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jarvis-home"
          $env:JARVIS_PORT = "8799"
          $p = Start-Process -FilePath "dist\jarvis-backend\jarvis-backend.exe" -PassThru -NoNewWindow `
               -RedirectStandardOutput "$env:RUNNER_TEMP\backend.log" -RedirectStandardError "$env:RUNNER_TEMP\backend.err"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8799/api/health; if ($r.ok) { $ok = $true; break } } catch {}
          }
          Invoke-RestMethod http://127.0.0.1:8799/api/graph | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8799/api/agenda | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8799/api/skills | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8799/api/mcp | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8799/api/phones | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8799/api/voice/clone | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8799/api/homeassistant/devices | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8799/api/memory/consolidation | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8799/api/files | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8799/api/hud/stats | ConvertTo-Json -Depth 4
          $g = Invoke-RestMethod "http://127.0.0.1:8799/api/gestures?check=true"
          $g | ConvertTo-Json -Depth 4
          if ($g.deps -ne "ok") { Stop-Process -Id $p.Id -Force; throw "hand tracker missing from the frozen backend: $($g.deps)" }
          $pr = Invoke-RestMethod "http://127.0.0.1:8799/api/presence?check=true"
          $pr | ConvertTo-Json -Depth 5
          if ($pr.deps -ne "ok") { Stop-Process -Id $p.Id -Force; throw "face engine missing from the frozen backend: $($pr.deps)" }
          Invoke-RestMethod http://127.0.0.1:8799/api/life/stats | ConvertTo-Json -Depth 4
          Invoke-RestMethod http://127.0.0.1:8799/api/voice/train | ConvertTo-Json -Depth 4
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\backend.log","$env:RUNNER_TEMP\backend.err"; throw "frozen backend did not start" }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || format('v__VERSION__-{0}', github.run_number) }}
          releaseName: Jarvis ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v__VERSION__ (manual build)' }}
          releaseBody: |
            Windows installer for Jarvis, the voice companion that can use your computer.

            **Install:** download `Jarvis_*_x64-setup.exe` below and run it (no Python or Node needed).
            Windows SmartScreen may warn because the installer isn't code-signed yet: choose *More info → Run anyway*.

            **First run:** open ⚙ → Brain, pick a provider and paste your API key. Local Whisper and Piper voices download on first use.
          releaseDraft: false
          prerelease: false
