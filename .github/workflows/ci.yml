name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system audio library
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pyflakes
      - name: Lint
        working-directory: backend
        run: python -m pyflakes jarvis
      - name: Smoke tests (graph memory, interruption rules, server)
        working-directory: backend
        env:
          JARVIS_HOME: ${{ runner.temp }}/jarvis-home
        run: python -m unittest discover -s tests -v

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check UI scripts
        run: for f in ui/*.js; do node --check "$f"; done

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Check the Tauri shell compiles
        working-directory: app/src-tauri
        run: cargo check --locked
